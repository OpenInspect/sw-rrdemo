services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  orchestrator:
    build: ./backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./web:/web:ro
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app worker -Q cv --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2}
    env_file: .env.example
    depends_on:
      redis:
        condition: service_healthy
